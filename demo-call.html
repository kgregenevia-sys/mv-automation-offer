<!DOCTYPE html><html lang='pl'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width, initial-scale=1.0'><title>Recepcja AI demo</title><style>*{margin:0;padding:0;box-sizing:border-box}body{font-family:-apple-system,Segoe UI,Roboto,sans-serif;background:#05070d;color:#fff;height:100vh;overflow:hidden}.phone{position:relative;max-width:430px;height:100vh;margin:0 auto;background:radial-gradient(120% 80% at 50% 0%,#16223b 0%,#0a1120 45%,#05070d 100%);display:flex;flex-direction:column}.lang{position:absolute;top:14px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:9}.lang button{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);color:#cdd6e6;font-size:12px;font-weight:700;padding:6px 12px;border-radius:100px}.lang button.on{background:#3ad0c9;color:#04121a}.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:70px 22px 44px;text-align:center}.tag{font-size:13px;color:#8aa0bf;letter-spacing:1px;text-transform:uppercase}.av{width:120px;height:120px;border-radius:50%;margin:22px 0 16px;background:linear-gradient(135deg,#3ad0c9,#5b7cff);display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:800;color:#04121a;position:relative}.av.small{width:80px;height:80px;font-size:30px;margin:14px auto 6px}.ring{position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(58,208,201,.45);animation:p 2s infinite}@keyframes p{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.5);opacity:0}}.who{font-size:28px;font-weight:800}.sub{font-size:15px;color:#8aa0bf;margin-top:6px}.actions{display:flex;gap:54px}.col{display:flex;flex-direction:column;align-items:center}.cbtn{width:70px;height:70px;border-radius:50%;border:none;font-size:28px;color:#fff}.accept{background:#27c93f}.decline{background:#ff3b30}.end{background:#ff3b30;width:62px;height:62px;border-radius:50%;border:none;color:#fff;font-size:24px;margin:14px auto 0}.lbl{font-size:12px;color:#8aa0bf;margin-top:8px}.timer{font-size:15px;color:#cdd6e6;margin-top:6px}.cap{margin:0 16px;padding:18px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:16px;min-height:110px;display:flex;flex-direction:column;justify-content:center;width:calc(100% - 32px)}.spk{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin-bottom:8px}.spk.ai{color:#3ad0c9}.spk.pat{color:#ffb454}.line{font-size:18px;line-height:1.45}.log{width:100%;margin-top:12px;max-height:30vh;overflow-y:auto;padding:0 16px}.bub{margin:7px 0;padding:9px 13px;border-radius:13px;font-size:14px;line-height:1.4;max-width:86%}.bub.ai{background:rgba(58,208,201,.13);border:1px solid rgba(58,208,201,.22);margin-right:auto}.bub.pat{background:rgba(255,180,84,.11);border:1px solid rgba(255,180,84,.22);margin-left:auto}.hide{display:none}.hint{font-size:11px;color:#6b7d9b;text-align:center;padding:8px 22px}</style></head><body><div class='phone'><div class='lang'><button data-l='pl' class='on'>PL</button><button data-l='en'>EN</button><button data-l='de'>DE</button></div><div class='screen' id='in'><div><div class='tag' id='t1'>Polaczenie przychodzace</div><div class='av'><div class='ring'></div>RA</div><div class='who'>Recepcja AI</div><div class='sub'>Good Life Clinic</div></div><div class='actions'><div class='col'><button class='cbtn decline'>X</button><div class='lbl' id='t2'>Odrzuc</div></div><div class='col'><button class='cbtn accept' id='acc'>&#9742;</button><div class='lbl' id='t3'>Odbierz</div></div></div></div><div class='screen hide' id='call'><div style='width:100%'><div class='tag' id='t4'>Polaczenie w toku</div><div class='av small'>RA</div><div class='timer' id='tm'>00:00</div></div><div class='cap'><div class='spk ai' id='sp'>RECEPCJA AI</div><div class='line' id='ln'>...</div></div><div class='log' id='lg'></div><div style='width:100%'><button class='end' id='end'>&#9742;</button><div class='hint'>Pelne audio = render ElevenLabs.</div></div></div></div><script>var D={pl:{t1:'Polaczenie przychodzace',t4:'Polaczenie w toku',dec:'Odrzuc',acc:'Odbierz',ai:'RECEPCJA AI',pa:'PACJENT',l:[['ai','Dzien dobry, Good Life Clinic, w czym moge pomoc?'],['p','No nareszcie ktos odbiera. Dzwonie trzeci raz. Chce wizyte dzisiaj, najlepiej od reki.'],['ai','Przepraszam za wczesniejsze proby - juz sie tym zajmuje. Do jakiego specjalisty?'],['p','Ortopeda. I nie mowcie mi, ze nie ma terminu, bo place i wymagam.'],['ai','Rozumiem, ze zalezy Panu na czasie. Dzis grafik pelny, ale mam odwolanie jutro 9:15 albo dzis 18:30 z listy rezerwowej. Ktore?'],['p','A czemu nie dzis normalnie? Inni sie wcisneli. Chce priorytet.'],['ai','Umawiamy w kolejnosci zgloszen, kazdy ma rowne szanse - Pana tez zapisze uczciwie. Najblizszy pewny to jutro 9:15. Rezerwowac?'],['p','A dostane znizke za to zamieszanie?'],['ai','O cenniku i rabatach decyduje klinika - przekaze to do recepcji, szczegoly dostanie Pan SMS-em. Rezerwuje jutro 9:15?'],['p','No dobra, niech bedzie. Marek Nowak, 501 234 567.'],['ai','Zapisalem Pana, Panie Marku, na ortopede jutro 9:15. SMS z potwierdzeniem wysylam teraz. Cos jeszcze?'],['p','Nie. Ale jak cos bedzie nie tak, to dzwonie.'],['ai','Oczywiscie, jestesmy do dyspozycji cala dobe. Dziekuje i do zobaczenia jutro.']]},en:{t1:'Incoming call',t4:'Call in progress',dec:'Decline',acc:'Accept',ai:'AI RECEPTIONIST',pa:'PATIENT',l:[['ai','Good morning, Good Life Clinic, how can I help you?'],['p','Finally, someone answers. I have called three times. I want an appointment today.'],['ai','I am sorry about the earlier attempts - I will take care of it now. Which specialist?'],['p','An orthopedist. And do not tell me there is nothing free, I pay and I expect service.'],['ai','I understand it is urgent. Fully booked today, but a cancellation tomorrow 9:15 or a waiting-list slot today 6:30 pm. Which?'],['p','Why not today, properly? Others squeezed in. I want priority.'],['ai','We schedule strictly in order, everyone gets a fair chance - you too. Earliest guaranteed is tomorrow 9:15. Reserve it?'],['p','Do I get a discount for all this hassle?'],['ai','Pricing and discounts are decided by the clinic - I will pass your note to the front desk, details by text. Book tomorrow 9:15?'],['p','Fine, whatever. Mark Nowak, 501 234 567.'],['ai','You are booked, Mr. Nowak, orthopedist tomorrow 9:15. Sending confirmation by text now. Anything else?'],['p','No. But if anything is wrong, I will call.'],['ai','Of course, we are available around the clock. Thank you and see you tomorrow.']]},de:{t1:'Eingehender Anruf',t4:'Anruf laeuft',dec:'Ablehnen',acc:'Annehmen',ai:'KI-REZEPTION',pa:'PATIENT',l:[['ai','Guten Tag, Good Life Clinic, wie kann ich helfen?'],['p','Na endlich. Ich rufe zum dritten Mal an. Ich will heute einen Termin, am liebsten sofort.'],['ai','Entschuldigen Sie die vorherigen Versuche - ich kuemmere mich darum. Zu welchem Facharzt?'],['p','Orthopaede. Und sagen Sie nicht, dass nichts frei ist, ich zahle und erwarte Service.'],['ai','Ich verstehe, es ist dringend. Heute voll, aber morgen 9:15 eine Absage oder heute 18:30 Warteliste. Was lieber?'],['p','Warum nicht heute regulaer? Andere haben sich reingedraengt. Ich will Vorrang.'],['ai','Wir vergeben nach Reihenfolge, jeder hat die gleiche Chance - Sie auch. Sicher ist morgen 9:15. Reservieren?'],['p','Bekomme ich einen Rabatt fuer den Aerger?'],['ai','Ueber Preise und Rabatte entscheidet die Klinik - ich leite es an die Rezeption weiter, Details per SMS. Morgen 9:15 buchen?'],['p','Na gut, meinetwegen. Marek Nowak, 501 234 567.'],['ai','Eingetragen, Herr Nowak, Orthopaede morgen 9:15. Bestaetigung per SMS jetzt. Sonst noch etwas?'],['p','Nein. Aber wenn etwas nicht stimmt, rufe ich an.'],['ai','Selbstverstaendlich, wir sind rund um die Uhr erreichbar. Danke und bis morgen.']]}};var L='pl',i=0,sec=0,tmr=null,go=false;function $(id){return document.getElementById(id)}function ui(){var d=D[L];$('t1').textContent=d.t1;$('t2').textContent=d.dec;$('t3').textContent=d.acc;$('t4').textContent=d.t4}var btns=document.querySelectorAll('.lang button');for(var b=0;b<btns.length;b++){btns[b].onclick=function(){if(go)return;for(var k=0;k<btns.length;k++)btns[k].className='';this.className='on';L=this.getAttribute('data-l');ui()}}function two(n){return(n<10?'0':'')+n}function tick(){sec++;$('tm').textContent=two(Math.floor(sec/60))+':'+two(sec%60)}function start(){go=true;i=0;sec=0;$('lg').innerHTML='';$('in').className='screen hide';$('call').className='screen';$('tm').textContent='00:00';tmr=setInterval(tick,1000);step()}function stop(){go=false;clearInterval(tmr);$('call').className='screen hide';$('in').className='screen'}function step(){if(!go)return;var d=D[L];if(i>=d.l.length){$('sp').textContent='';$('ln').textContent='- koniec rozmowy -';setTimeout(function(){if(go)stop()},1800);return}var c=d.l[i],ai=c[0]=='ai';$('sp').className='spk '+(ai?'ai':'pat');$('sp').textContent=ai?d.ai:d.pa;$('ln').textContent=c[1];var bb=document.createElement('div');bb.className='bub '+(ai?'ai':'pat');bb.textContent=c[1];$('lg').appendChild(bb);$('lg').scrollTop=$('lg').scrollHeight;var dur=Math.max(2300,c[1].length*52);i++;setTimeout(step,dur)}$('acc').onclick=start;$('end').onclick=stop;document.querySelector('.decline').onclick=function(){};ui();</script></body></html>
