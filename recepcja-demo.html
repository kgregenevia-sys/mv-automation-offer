ę. Premium = ElevenLabs.</div></div></div></div><script>var D={pl:{t1:'Połączenie przychodzące',t4:'Połączenie w toku',dec:'Odrzuć',acc:'Odbierz',ai:'RECEPCJA AI',pa:'PACJENT',code:'pl-PL',l:[['ai','Dzień dobry, Good Life Clinic, w czym mogę pomóc?'],['p','Dzień dobry. Od razu mówię, nie mam czasu na gadanie. Chcę wizytę dzisiaj, najlepiej od ręki.'],['ai','Jasne, już się tym zajmuję. Do jakiego specjalisty?'],['p','Ortopeda. I nie mówcie mi, że nie ma terminu, bo płacę i wymagam.'],['ai','Rozumiem, że zależy Panu na czasie. Dziś grafik jest pełny, ale mam odwołanie jutro o dziewiątej piętnaście albo dziś o osiemnastej trzydzieści z listy rezerwowej. Które?'],['p','A czemu nie dziś normalnie? Inni się wcisnęli. Chcę priorytet.'],['ai','Umawiamy w kolejności zgłoszeń, każdy ma równe szanse, Pana też zapiszę uczciwie. Najbliższy pewny to jutro dziewiąta piętnaście. Rezerwować?'],['p','A dostanę zniżkę za to całe zamieszanie?'],['ai','O cenniku i rabatach decyduje klinika, przekażę to do recepcji, a szczegóły dostanie Pan SMS-em. Rezerwuję jutro dziewiąta piętnaście?'],['p','No dobra, niech będzie. Marek Nowak, pięćset jeden, dwieście trzydzieści cztery, pięćset sześćdziesiąt siedem.'],['ai','Zapisałem Pana, Panie Marku, na ortopedę jutro o dziewiątej piętnaście. SMS z potwierdzeniem wysyłam teraz. Coś jeszcze?'],['p','Nie. Ale jak coś będzie nie tak, to dzwonię.'],['ai','Oczywiście, jesteśmy do dyspozycji całą dobę. Dziękuję i do zobaczenia jutro.']]},en:{t1:'Incoming call',t4:'Call in progress',dec:'Decline',acc:'Accept',ai:'AI RECEPTIONIST',pa:'PATIENT',code:'en-US',l:[['ai','Good morning, Good Life Clinic, how can I help you?'],['p','Good morning. Let me be clear, I have no time to waste. I want an appointment today, right now.'],['ai','Of course, I will take care of it now. Which specialist?'],['p','An orthopedist. And do not tell me there is nothing free, I pay and I expect service.'],['ai','I understand it is urgent. Fully booked today, but a cancellation tomorrow at nine fifteen, or a waiting list slot today at six thirty. Which?'],['p','Why not today, properly? Others squeezed in. I want priority.'],['ai','We schedule strictly in order, everyone gets a fair chance, you too. Earliest guaranteed is tomorrow at nine fifteen. Reserve it?'],['p','Do I get a discount for all this hassle?'],['ai','Pricing and discounts are decided by the clinic, I will pass your note to the front desk, details by text. Book tomorrow at nine fifteen?'],['p','Fine, whatever. Mark Nowak, five oh one, two three four, five six seven.'],['ai','You are booked, Mister Nowak, orthopedist tomorrow at nine fifteen. Sending confirmation by text now. Anything else?'],['p','No. But if anything is wrong, I will call.'],['ai','Of course, we are available around the clock. Thank you and see you tomorrow.']]},de:{t1:'Eingehender Anruf',t4:'Anruf läuft',dec:'Ablehnen',acc:'Annehmen',ai:'KI-REZEPTION',pa:'PATIENT',code:'de-DE',l:[['ai','Guten Tag, Good Life Clinic, wie kann ich Ihnen helfen?'],['p','Guten Tag. Gleich vorweg, ich habe keine Zeit. Ich will heute einen Termin, am liebsten sofort.'],['ai','Natürlich, ich kümmere mich sofort darum. Zu welchem Facharzt?'],['p','Orthopäde. Und sagen Sie nicht, dass nichts frei ist, ich zahle und erwarte Service.'],['ai','Ich verstehe, es ist dringend. Heute voll, aber morgen um neun Uhr fünfzehn eine Absage oder heute um achtzehn Uhr dreißig Warteliste. Was lieber?'],['p','Warum nicht heute regulär? Andere haben sich reingedrängt. Ich will Vorrang.'],['ai','Wir vergeben nach Reihenfolge, jeder hat die gleiche Chance, Sie auch. Sicher ist morgen um neun Uhr fünfzehn. Reservieren?'],['p','Bekomme ich einen Rabatt für den ganzen Ärger?'],['ai','Über Preise und Rabatte entscheidet die Klinik, ich leite es an die Rezeption weiter, Details per SMS. Morgen um neun Uhr fünfzehn buchen?'],['p','Na gut, meinetwegen. Marek Nowak, fünf null eins, zwei drei vier, fünf sechs sieben.'],['ai','Eingetragen, Herr Nowak, Orthopäde morgen um neun Uhr fünfzehn. Bestätigung per SMS jetzt. Sonst noch etwas?'],['p','Nein. Aber wenn etwas nicht stimmt, rufe ich an.'],['ai','Selbstverständlich, wir sind rund um die Uhr erreichbar. Danke und bis morgen.']]}};var L='pl',i=0,sec=0,tmr=null,go=false;var synth=window.speechSynthesis||null;var voices=[];function loadV(){voices=synth?synth.getVoices():[]}if(synth){loadV();synth.onvoiceschanged=loadV}function score(v){var n=v.name.toLowerCase();var s=0;if(/google|natural|online|enhanced|premium|neural/.test(n))s+=3;return s}function pick(code,who){var base=code.split('-')[0];var m=voices.filter(function(v){return v.lang&&v.lang.toLowerCase().indexOf(base)===0});if(!m.length)return null;var fem=/zosia|zofia|paulina|ewa|maja|anna|female|samantha|victoria|google|katja|hedda/i;var male=/krzysztof|marek|adam|jacek|tomasz|daniel|male|conrad|stefan/i;var want=who==='ai'?fem:male;var cand=m.filter(function(v){return want.test(v.name)});var pool=cand.length?cand:m;pool.sort(function(a,b){return score(b)-score(a)});return pool[0]}function $(id){return document.getElementById(id)}function ui(){var d=D[L];$('t1').textContent=d.t1;$('t2').textContent=d.dec;$('t3').textContent=d.acc;$('t4').textContent=d.t4}var btns=document.querySelectorAll('.lang button');for(var b=0;b<btns.length;b++){btns[b].onclick=function(){if(go)return;for(var k=0;k<btns.length;k++)btns[k].className='';this.className='on';L=this.getAttribute('data-l');ui()}}function two(n){return(n<10?'0':'')+n}function tick(){sec++;$('tm').textContent=two(Math.floor(sec/60))+':'+two(sec%60)}function start(){go=true;i=0;sec=0;$('lg').innerHTML='';$('in').className='screen hide';$('call').className='screen';$('tm').textContent='00:00';tmr=setInterval(tick,1000);if(synth)synth.cancel();step()}function stop(){go=false;clearInterval(tmr);if(synth)synth.cancel();$('call').className='screen hide';$('in').className='screen'}function step(){if(!go)return;var d=D[L];if(i>=d.l.length){$('sp').textContent='';$('ln').textContent='- koniec rozmowy -';if(synth)synth.cancel();setTimeout(function(){if(go)stop()},1800);return}var c=d.l[i],ai=c[0]=='ai';$('sp').className='spk '+(ai?'ai':'pat');$('sp').textContent=ai?d.ai:d.pa;$('ln').textContent=c[1];var bb=document.createElement('div');bb.className='bub '+(ai?'ai':'pat');bb.textContent=c[1];$('lg').appendChild(bb);$('lg').scrollTop=$('lg').scrollHeight;var advanced=false;function nxt(ms){if(advanced)return;advanced=true;setTimeout(function(){i++;step()},ms)}var est=Math.max(2600,c[1].length*62);if(synth){try{synth.cancel();var u=new SpeechSynthesisUtterance(c[1]);u.lang=d.code;var v=pick(d.code,c[0]);if(v)u.voice=v;u.rate=ai?0.96:1.02;u.pitch=ai?1.06:0.82;u.onend=function(){nxt(ai?650:520)};u.onerror=function(){nxt(300)};synth.speak(u)}catch(e){}}setTimeout(function(){nxt(200)},est+(synth?2100:0))}$('acc').onclick=start;$('end').onclick=stop;document.querySelector('.decline').onclick=function(){};ui();</script></body></html>
