<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>AUDYT — dodaj lead</title>
<style>
  :root{--blue:#0b5e8a;--ink:#1a2733;--bg:#f4f7f9;--line:#dce5ec}
  *{box-sizing:border-box}
  body{margin:0;font-family:Arial,Helvetica,sans-serif;background:var(--bg);color:var(--ink);display:flex;min-height:100vh;align-items:center;justify-content:center;padding:20px}
  .card{background:#fff;max-width:440px;width:100%;border:1px solid var(--line);border-radius:16px;padding:28px;box-shadow:0 10px 30px rgba(11,94,138,.08)}
  h1{font-size:20px;margin:0 0 4px}
  p.sub{margin:0 0 20px;color:#5b6b78;font-size:13px}
  label{display:block;font-size:13px;font-weight:bold;margin:14px 0 5px}
  input,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;font-size:15px;font-family:inherit}
  textarea{resize:vertical;min-height:60px}
  button{margin-top:20px;width:100%;background:var(--blue);color:#fff;border:0;padding:13px;border-radius:10px;font-size:16px;font-weight:bold;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .msg{margin-top:14px;padding:11px;border-radius:9px;font-size:14px;display:none}
  .ok{background:#e6f5ec;color:#1b6b3a;display:block}
  .err{background:#fdeaea;color:#a32020;display:block}
  .req{color:#c0392b}
</style>
</head>
<body>
  <div class="card">
    <h1>AUDYT — nowy lead</h1>
    <p class="sub">Wpisz osobę, która napisała „AUDYT". PDF + sekwencja follow-up wyślą się automatycznie.</p>
    <label>Imię</label>
    <input id="name" placeholder="np. Anna Kowalska" autocomplete="off">
    <label>E-mail <span class="req">*</span></label>
    <input id="email" type="email" placeholder="kontakt@klinika.pl" autocomplete="off">
    <label>Grupa / źródło</label>
    <input id="group" placeholder="np. AI dla klinik PL" autocomplete="off">
    <label>Notatka</label>
    <textarea id="comment" placeholder="kontekst, nazwa kliniki..."></textarea>
    <button id="send">Wyślij PDF audytu</button>
    <div id="msg" class="msg"></div>
  </div>
<script>
  var WEBHOOK = "https://n8n.kgregenevia.pro/webhook/audyt-intake";
  var btn = document.getElementById('send'), msg = document.getElementById('msg');
  function show(t, ok){ msg.textContent = t; msg.className = 'msg ' + (ok ? 'ok' : 'err'); }
  btn.onclick = async function(){
    var email = document.getElementById('email').value.trim();
    if(!email || email.indexOf('@') < 0){ show('Podaj poprawny e-mail.', false); return; }
    btn.disabled = true; show('Wysyłam...', true);
    try{
      var r = await fetch(WEBHOOK, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({
        name: document.getElementById('name').value.trim(),
        email: email,
        group: document.getElementById('group').value.trim(),
        comment: document.getElementById('comment').value.trim()
      })});
      var d = await r.json();
      if(d && d.ok){ show('Gotowe — PDF poszedł, lead #' + d.id + ' zapisany.', true);
        document.getElementById('name').value=''; document.getElementById('email').value=''; document.getElementById('group').value=''; document.getElementById('comment').value=''; }
      else { show('Błąd: ' + ((d && d.error) || 'nieznany'), false); }
    }catch(e){ show('Błąd sieci: ' + e.message, false); }
    btn.disabled = false;
  };
</script>
</body>
</html>
